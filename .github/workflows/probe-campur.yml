name: probe-campur
on:
  push:
    branches: [claude/probe-campur]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          B=https://campur.ai.studio
          curl -sSL -m 30 "$B/" -o page.html || true
          JS=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' page.html | head -1)
          curl -sSL -m 60 "$B$JS" -o app.js || true
          python3 -c "
          s=open('app.js',encoding='utf-8',errors='ignore').read()
          i=s.find('/api/archive/articles?\${q')
          print('--- context', s[max(0,i-900):i+80] if i>=0 else 'not found')
          " || true
          for p in "/api/archive/articles?limit=3" "/api/archive/articles?q=haze&limit=50" "/api/archive/articles?search=haze&limit=50" "/api/archive/articles?keyword=haze&limit=50" "/api/archive/articles?query=haze&limit=50"; do
            echo "===== GET $p"
            curl -sS -m 60 -o out -w "%{http_code} %{size_download}\n" "$B$p" || true
            python3 - <<'PY'
          import json,re
          try: d=json.load(open('out'))
          except Exception as e: print('not json', open('out','rb').read()[:200]); raise SystemExit
          arts = d.get('articles') if isinstance(d,dict) else d
          print('keys', list(d.keys())[:15] if isinstance(d,dict) else type(d))
          for k in ('total','totalCount','page','hasMore','limit'):
              if isinstance(d,dict) and k in d: print(k, d[k])
          if arts:
              print('n', len(arts), 'fields', list(arts[0].keys()))
              hz=[a for a in arts if re.search(r'(?i)haze|jerebu|ヘイズ|煙霧|kabut asap|hotspot|peat', json.dumps(a,ensure_ascii=False))]
              print('haze-matching', len(hz))
              for a in (hz or arts)[:6]:
                  print(' -', a.get('isoDate') or a.get('pubDate'), a.get('sourceName'), '|', (a.get('titleJa') or a.get('title'))[:80], '|', (a.get('category') or ''))
          PY
          done
