name: probe-campur
on:
  push:
    branches: [claude/probe-campur]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://campur.ai.studio
          curl -sSL -m 30 "$B/" -o page.html || true
          JS=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' page.html | head -1); echo "JS=$JS"
          curl -sSL -m 60 "$B$JS" -o app.js; wc -c app.js
          echo "--- urls in bundle"; grep -oE 'https?://[A-Za-z0-9./_:-]+' app.js | sort | uniq -c | sort -rn | head -60
          echo "--- api paths"; grep -oE '"/(api|rss|feed|data|news)[A-Za-z0-9/_.?=&-]*"' app.js | sort | uniq -c | sort -rn | head -60
          echo "--- fetch( contexts"; grep -oE 'fetch\([^)]{0,160}' app.js | sort -u | head -40
          echo "--- firebase/supabase"; grep -oE '(firebaseapp\.com|firestore|supabase\.co|projectId:"[^"]+"|apiKey:"[^"]+"|collection\([^)]{0,60}\))' app.js | sort | uniq -c | head -30
          echo "--- haze mentions"; grep -oE '.{0,80}(ヘイズ|haze|Haze|jerebu|Jerebu).{0,80}' app.js | head -20
          for p in /sitemap.xml /robots.txt /rss.xml /feed.xml /api/news /api/articles /news.json /api/haze; do
            echo "===== $p"; curl -sS -m 20 -o out -w "%{http_code} %{content_type} %{size_download}\n" "$B$p"; head -c 1500 out; echo
          done
