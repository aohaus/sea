name: probe-campur
on:
  push:
    branches: [claude/probe-campur]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          B=https://mycmaq.met.gov.my
          curl -sSL -m 30 "$B/" -o index.html || true
          D=$(grep -oE 'display_[0-9]{8}_[0-9]{2}\.html' index.html | sort -u | tail -1); echo "latest $D"
          curl -sSL -m 30 -D h.txt "$B/$D" -o d.html || true
          grep -iE '^(HTTP|content-type|access-control|last-modified)' h.txt; wc -c d.html
          echo "--- refs"; grep -oiE '(src|href|data-[a-z]+)="[^"]+"' d.html | sort | uniq -c | sort -rn | head -60
          echo "--- quoted file-like strings"; grep -oE "[\"'][^\"' ]+\.(png|gif|jpg|json|csv|txt|geojson|js|nc)[\"']" d.html | sort -u | head -80
          echo "--- head of body text"; python3 -c "
          import re
          s=open('d.html',encoding='utf-8',errors='ignore').read()
          print(len(s))
          t=re.sub(r'<style.*?</style>','',s,flags=re.S)
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',t,flags=re.S)
          print('n scripts',len(scripts))
          for sc in scripts[:6]: print('SCRIPT>>', sc[:1800].replace('\n',' '))
          print('TEXT>>', re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',re.sub(r'<script.*?</script>','',t,flags=re.S)))[:2500])
          "
          F=$(grep -oE "[\"'][^\"' ]+\.(json|csv|txt)[\"']" d.html | head -3 | tr -d "\"'")
          for f in $F; do case "$f" in http*) u="$f";; /*) u="$B$f";; *) u="$B/$f";; esac; echo "===== $u"; curl -sS -m 20 -D hh -o o "$u" || true; grep -iE '^(HTTP|content-type|access-control)' hh; head -c 1500 o; echo; done
