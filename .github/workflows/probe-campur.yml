name: probe-campur
on:
  push:
    branches: [claude/probe-campur]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          B=https://mycmaq.met.gov.my
          curl -sSL -m 30 "$B/" -o /tmp/index.html || true
          grep -oE 'display_[0-9]{8}_[0-9]{2}\.html' /tmp/index.html | sort -u
          R=$(grep -oE 'display_[0-9]{8}_[0-9]{2}\.html' /tmp/index.html | sort -u | tail -1 | sed 's/display_//; s/\.html//')
          curl -sSL -m 30 "$B/$R/manifest.json" -o /tmp/m.json
          python3 -c "
          import json; f=json.load(open('/tmp/m.json'))['files']; p=[x for x in f if x.startswith('PM25_TOT_d02')]
          print(len(p), p[:3], p[-3:]); open('/tmp/first','w').write(p[0]); open('/tmp/mid','w').write(p[len(p)//2])"
          mkdir -p probe
          for k in first mid; do F=$(cat /tmp/$k); curl -sS -m 30 -H "Referer: https://aohaus.github.io/sea/haze/" -D /tmp/h -o probe/$F "$B/$R/$F"; grep -iE '^(HTTP|content-type|content-length|access-control|cache-control)' /tmp/h; file probe/$F; done
          F=$(ls probe | head -1); python3 -c "
          import struct; d=open('probe/$F','rb').read(); print('png size', struct.unpack('>II', d[16:24]))"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -qm "probe images" && git push
