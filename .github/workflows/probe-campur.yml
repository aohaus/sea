name: probe-campur
on:
  push:
    branches: [claude/probe-campur]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          B=https://mycmaq.met.gov.my
          curl -sSL -m 30 "$B/" -o index.html || true
          R=$(grep -oE 'display_[0-9]{8}_[0-9]{2}\.html' index.html | sort -u | tail -1 | sed 's/display_//; s/\.html//'); echo "run $R"
          curl -sSL -m 30 -D hh "$B/$R/manifest.json" -o m.json || true
          grep -iE '^(HTTP|content-type|access-control)' hh
          python3 - <<'PY'
          import json,re,collections
          m=json.load(open('m.json'))
          files = m if isinstance(m,list) else (m.get('files') or [v for v in m.values() if isinstance(v,list)][0])
          print('type', type(m).__name__, 'keys', list(m.keys())[:10] if isinstance(m,dict) else '', 'n', len(files))
          pre=collections.Counter(re.sub(r'_\d{8}_\d{2}LST\.png$','',f) for f in files)
          print('prefix counts:'); [print('  ',k,v) for k,v in sorted(pre.items())]
          ext=collections.Counter(f.rsplit('.',1)[-1] for f in files); print('ext', ext)
          ts=[f for f in files if 'timeseries' in f]; print('timeseries', len(ts)); [print('  ',f) for f in ts[:80]]
          pm=[f for f in files if f.startswith('PM25_d02')]; print('PM25_d02 first/last', pm[:2], pm[-2:], len(pm))
          PY
          T=$(python3 -c "
          import json; m=json.load(open('m.json')); f=m if isinstance(m,list) else (m.get('files') or [v for v in m.values() if isinstance(v,list)][0])
          t=[x for x in f if 'timeseries' in x]; print(t[0] if t else '')")
          if [ -n "$T" ]; then curl -sS -m 30 -D h2 -o ts.bin "$B/$R/$T"; grep -iE '^(HTTP|content-type|content-length)' h2; file ts.bin; head -c 600 ts.bin | strings | head; fi
          curl -sS -m 30 -o pm.png "$B/$R/$(python3 -c "
          import json; m=json.load(open('m.json')); f=m if isinstance(m,list) else (m.get('files') or [v for v in m.values() if isinstance(v,list)][0])
          print([x for x in f if x.startswith('PM25_d02')][0])")"; file pm.png
          for x in "$B/$R/" "$B/$R/stations.json" "$B/$R/timeseries/" "$B/data/"; do echo "== $x"; curl -sS -m 15 -o o -w "%{http_code} %{content_type} %{size_download}\n" "$x" || true; done
