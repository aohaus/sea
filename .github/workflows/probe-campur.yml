name: probe-campur
on:
  push:
    branches: [claude/probe-campur]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          B=https://mycmaq.met.gov.my
          curl -sSL -m 30 -D h.txt "$B/" -o page.html || true
          grep -iE '^(HTTP|content-type|access-control|server)' h.txt
          wc -c page.html
          echo "--- title/scripts/links"; grep -oiE '<title>[^<]*</title>|(src|href)="[^"]+"' page.html | sort -u | head -80
          echo "--- text"; sed -e 's/<script.*<\/script>//g; s/<[^>]*>/ /g' page.html | tr -s ' \n' | head -c 2500; echo
          for js in $(grep -oE '(src)="[^"]+\.js[^"]*"' page.html | sed 's/src="//; s/"$//' | head -8); do
            case "$js" in http*) u="$js";; /*) u="$B$js";; *) u="$B/$js";; esac
            echo "===== JS $u"; curl -sSL -m 30 "$u" -o j.js || true; wc -c j.js
            python3 -c "
          import re
          s=open('j.js',encoding='utf-8',errors='ignore').read()
          for m in sorted(set(re.findall(r'[\"\'\`]((?:https?://[^\"\'\` ]+|/[A-Za-z0-9_./-]*)(?:json|geojson|csv|png|tif|nc|api|forecast|data)[^\"\'\` ]*)[\"\'\`]', s)))[:60]: print(' ', m)
          for k in ['fetch(','axios','XMLHttpRequest','.json','api/','forecast','AQI','API','pm25','PM2.5','station']:
              i=s.find(k)
              if i>=0: print('  ctx', k, '::', s[max(0,i-150):i+150].replace('\n',' '))
          " || true
          done
          for p in /api /api/forecast /data /forecast /api/stations /json /latest; do echo "== $p"; curl -sS -m 15 -o o -w "%{http_code} %{content_type} %{size_download}\n" "$B$p" || true; head -c 300 o; echo; done
