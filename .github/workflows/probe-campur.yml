name: probe-campur
on:
  push:
    branches: [claude/probe-campur]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          for u in https://aohaus.github.io/sea/ https://aohaus.github.io/sea/index.html https://aohaus.github.io/sea/basic/index.html https://aohaus.github.io/sea/haze/ https://aohaus.github.io/sea/haze/app.js?v=20261023e https://aohaus.github.io/sea/haze/haze.css?v=20261023e; do
            curl -sS -m 20 -o o -w "%{http_code} %{size_download} $u\n" "$u"; done
          curl -sS https://aohaus.github.io/sea/haze/ | grep -n 'clock\|v=2026' | head
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            for (const u of ['https://aohaus.github.io/sea/index.html','https://aohaus.github.io/sea/basic/index.html','https://aohaus.github.io/sea/haze/','https://aohaus.github.io/sea/haze/understand.html','https://aohaus.github.io/sea/haze/actions.html']) {
              const p = await b.newPage({ viewport: { width: 1200, height: 900 } }); const errs = [];
              p.on('pageerror', e => errs.push('pageerror ' + e.message)); p.on('console', m => m.type() === 'error' && errs.push('console ' + m.text()));
              await p.goto(u, { waitUntil: 'load', timeout: 60000 }); await p.waitForTimeout(6000);
              const info = await p.evaluate(() => ({ title: document.title, textLen: document.body ? document.body.innerText.length : 0, clock: document.getElementById('clock')?.textContent, now: document.getElementById('now-panel')?.innerText.slice(0, 80) }));
              console.log(u, JSON.stringify(info), errs.slice(0, 8));
              await p.close();
            }
            await b.close();
          })();
          JS
          npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx -y playwright@1.48.2 install chromium >/dev/null 2>&1 && node t.js
