name: probe-campur
on:
  push:
    branches: [claude/probe-campur]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          for B in https://eqms.doe.gov.my https://apims.doe.gov.my; do
            echo "======== $B"; curl -sSL -m 30 -o p.html -w "%{http_code} %{url_effective}\n" "$B/" || true
            grep -oiE '(src|href)="[^"]+\.js[^"]*"' p.html | head -20
            for js in $(grep -oiE 'src="[^"]+\.js[^"]*"' p.html | sed 's/src="//I; s/"$//' | head -12); do
              case "$js" in http*) u="$js";; /*) u="$B$js";; *) u="$B/$js";; esac
              curl -sSL -m 30 "$u" -o j.js || continue
              python3 -c "
          import re
          s=open('j.js',encoding='utf-8',errors='ignore').read()
          found=sorted(set(re.findall(r'[\"\'\`]((?:https?://[^\"\'\` ]*)?/api[0-9]?/[A-Za-z0-9_./\-]+)', s)))
          if found: print('JS', '$u', len(s)); [print('   ', f) for f in found[:80]]
          "
            done
          done
          echo "======== guesses"
          for u in "https://eqms.doe.gov.my/api3/publicportalapims/apitablehourly" "https://eqms.doe.gov.my/api3/publicportalapims/apitable" "https://eqms.doe.gov.my/api3/publicportalapims/stations" "https://eqms.doe.gov.my/api3/publicportalapims/latest"; do
            echo "== $u"; curl -sS -m 20 -o o -w "%{http_code} %{content_type} %{size_download}\n" "$u" || true; head -c 400 o; echo; done
