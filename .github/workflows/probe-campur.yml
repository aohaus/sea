name: probe-campur
on:
  push:
    branches: [claude/probe-campur]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          B=https://mycmaq.met.gov.my
          curl -sSL -m 30 "$B/" -o index.html || true
          R=$(grep -oE 'display_[0-9]{8}_[0-9]{2}\.html' index.html | sort -u | tail -1 | sed 's/display_//; s/\.html//'); echo "run $R"
          curl -sSL -m 30 "$B/display_$R.html" -o d.html || true
          echo "--- how files are listed"; python3 -c "
          s=open('d.html',encoding='utf-8',errors='ignore').read()
          for k in ['manifest','fetch(','BASE_FOLDER +','allFiles =','autoindex','href']:
              i=s.find(k)
              while i>=0 and k in ('manifest','fetch('):
                  print(k,'::',s[max(0,i-300):i+400].replace('\n',' ')); i=s.find(k,i+1)
                  if i>20000: break
              if k not in ('manifest','fetch(') and i>=0: print(k,'::',s[max(0,i-200):i+300].replace('\n',' '))
          "
          for u in "$B/$R/" "$B/$R/manifest.json"; do echo "===== $u"; curl -sS -m 30 -D hh -o o "$u" || true; grep -iE '^(HTTP|content-type|access-control)' hh; wc -c o; head -c 3000 o; echo; done
          echo "--- timeseries entries"; grep -oE 'cmaq_timeseries_[^"<>]+' o | sort -u | head -80
