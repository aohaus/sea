name: Collect haze readings

# Every hour, a few minutes past the hour so the sources have published the hour's reading. The page
# uses two-hour slots; running hourly means a slot still gets a reading when GitHub delays or skips a
# scheduled run (which happens under load), and the later reading in a slot replaces the earlier one.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/collect_haze.py"
      - "scripts/collect_haze_news.py"
      - ".github/workflows/collect-haze.yml"

permissions:
  contents: write

concurrency:
  group: collect-haze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect DOE readings
        run: python scripts/collect_haze.py
      # Haze news from Campur.ai for the "アクションする" page. The script fetches only when
      # haze/data/news.json is about 3 hours old, so most hourly runs skip it.
      - name: Collect haze news
        run: python scripts/collect_haze_news.py
      - name: Commit readings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haze/data/
          if git diff --cached --quiet; then
            echo "No new readings."
          else
            git commit -m "data(haze): readings $(TZ=Asia/Kuala_Lumpur date +%Y-%m-%dT%H:%M)"
            for attempt in 1 2 3; do
              if git push; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort; echo "rebase conflict; the next run will add the readings"; exit 1; }
            done
          fi
