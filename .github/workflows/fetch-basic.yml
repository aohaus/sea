name: Fetch basic country data

on:
  # Monthly refresh: 1st of each month at 01:00 UTC (10:00 JST)
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_basic.py"
      - "scripts/fetch_indicators.py"
      - "scripts/build_dataset.py"
      - "scripts/fetch_cities.py"
      - "scripts/snapshot.py"
      - "scripts/check_health.py"
      - "basic/cities/cities.json"
      - "basic/reference/ajc_*.json"
      - "basic/countries.json"
      - "basic/sources.json"
      - "basic/schema/**"
      - ".github/workflows/fetch-basic.yml"

permissions:
  contents: write
  issues: write   # open / update / close the data-health issue

concurrency:
  group: fetch-basic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch basic statistics and indicators
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and build profiles
        run: python scripts/fetch_basic.py

      - name: Fetch and build economic indicators
        run: python scripts/fetch_indicators.py

      - name: Fetch and build major-city data
        run: python scripts/fetch_cities.py

      - name: Build dataset and validate against references
        run: python scripts/build_dataset.py

      # Yearly version: the first successful run of each year (on main) freezes the data
      # as basic/archive/<year>/. Existing versions are never overwritten.
      - name: Freeze this year's version if missing
        if: github.ref == 'refs/heads/main'
        run: python scripts/snapshot.py --if-missing

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basic/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data(basic): update basic statistics"
            git push
          fi

      # Data health: open (or update) an issue labelled data-health when a source fails, a manual
      # import is due, or a series has stopped; close it once everything is fine again.
      - name: Check data health
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python scripts/check_health.py --json "$RUNNER_TEMP/health.json" --markdown "$RUNNER_TEMP/health.md" --job-status "$JOB_STATUS"
          ok=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['ok'])" "$RUNNER_TEMP/health.json")
          gh label create data-health --color D93F0B --description "データ取得の自動チェック" --force
          num=$(gh issue list --label data-health --state open --json number --jq '.[0].number')
          if [ "$ok" = "True" ]; then
            if [ -n "$num" ]; then gh issue close "$num" --comment "自動チェックで問題が見つからなくなったため閉じます。"; fi
          elif [ -n "$num" ]; then
            gh issue comment "$num" --body-file "$RUNNER_TEMP/health.md"
          else
            gh issue create --title "データ取得の自動チェックで要確認の項目があります" --label data-health --body-file "$RUNNER_TEMP/health.md"
          fi
