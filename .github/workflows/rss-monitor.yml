name: RSS Monitor

on:
  schedule:
    # Every day at 00:00 UTC (09:00 JST)
    - cron: "0 0 * * *"
  workflow_dispatch:
  # TEMPORARY: verify live feeds from GitHub runners before merging. Remove before merge.
  push:
    branches:
      - claude/malaysia-rss-monitor-ob13zm

permissions:
  contents: read

jobs:
  check-rss:
    name: Check Malaysia news RSS feeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSS health check
        run: python scripts/check_rss.py

      - name: TEMP probe candidate URLs
        if: always()
        run: python scripts/_probe_candidates.py
