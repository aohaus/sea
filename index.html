<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sea — ASEAN データとヘイズモニター</title>
<meta name="description" content="ASEAN 各国の統計を比べる「ASEAN データエクスプローラー」と、マレーシア・シンガポールの大気質を見る「ヘイズモニター」の入口です。">
<link rel="icon" href="basic/favicon.png" type="image/png" sizes="64x64">
<link rel="icon" href="basic/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="basic/apple-touch-icon.png">
<style>
  /* Same palette as Sea basic (Campur.ai), with a dark variant. */
  :root { --bg: #f7f5f0; --panel: #fff; --fg: #1e1e1c; --muted: #5e5a55; --line: #e4e0d8; --frame: #2b2a27; --accent: #0f5a44; --rust: #b4501c; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121411; --panel: #1a1d19; --fg: #ecebe6; --muted: #a3a09a; --line: #2d302b; --frame: #5a5d56; --accent: #5cc79e; --rust: #e07a45; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; line-height: 1.6; }
  main { max-width: 860px; margin: 0 auto; padding: 40px 16px 56px; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 900; line-height: 1.25; }
  .lead { margin: 0; color: var(--muted); font-size: .92rem; }
  .apps { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  a.app { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start; padding: 18px; background: var(--panel); border: 1.5px solid var(--frame); border-radius: 8px; color: inherit; text-decoration: none; }
  a.app:hover, a.app:focus-visible { border-color: var(--accent); outline: none; box-shadow: inset 0 -3px 0 var(--rust); }
  a.app img { width: 56px; height: 56px; border-radius: 12px; }
  a.app h2 { margin: 0 0 4px; font-size: 1.1rem; font-weight: 900; }
  a.app p { margin: 0; font-size: .85rem; color: var(--muted); }
  a.app .go { display: inline-block; margin-top: 8px; font-size: .82rem; font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Sea</h1>
    <p class="lead">東南アジア（ASEAN）を、データで見るためのページです。</p>
  </header>
  <div class="apps">
    <a class="app" href="basic/index.html">
      <img src="basic/apple-touch-icon.png" alt="">
      <div>
        <h2>ASEAN データエクスプローラー</h2>
        <p>人口・経済・物価・為替・日本とのつながり・主要都市など、ASEAN 各国の統計を長期で比べます。</p>
        <span class="go">開く →</span>
      </div>
    </a>
    <a class="app" href="haze/index.html">
      <img src="haze/apple-touch-icon.png" alt="">
      <div>
        <h2>ヘイズモニター</h2>
        <p>マレーシア・シンガポールの大気質（US AQI・API・PM2.5）を、いま・過去14日・5日先の予報で見ます。指標の違いや、ヘイズへの取り組みも。</p>
        <span class="go">開く →</span>
      </div>
    </a>
  </div>
</main>
</body>
</html>
